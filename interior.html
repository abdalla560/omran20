<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digitals EGYPT | وزارة الداخلية</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.plate{display:inline-block;background:#fff;color:#111;border:3px solid #111;border-radius:8px;padding:2px 18px;font-weight:800;font-size:1.3rem;letter-spacing:3px;margin:4px 0}
.vio{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.vio:last-child{border:0}
</style>
</head>
<body>
<main class="page" id="main">
  <div class="crumbs"><a href="index.html">الرئيسية</a> › وزارة الداخلية</div>
  <div class="page-head"><div><h1> بوابة وزارة الداخلية الرقمية</h1><p>المرور • الأحوال المدنية • الأمن والجنسية</p></div>
    <div class="btn-row" style="margin:0"><a class="button ghost sm" href="passports.html">الجوازات والخارجية</a><a class="button ghost sm" href="defense.html">التجنيد</a><a class="button ghost sm" href="wallet.html">محفظتي</a></div></div>

  <div class="tabs" role="tablist" aria-label="أقسام الداخلية">
    <button role="tab" id="t-ov" aria-selected="true" aria-controls="p-ov"> المرور والوثائق</button>
    <button role="tab" id="t-svc" aria-selected="false" aria-controls="p-svc"> كل الخدمات</button>
    <button role="tab" id="t-reqs" aria-selected="false" aria-controls="p-reqs"> طلباتي</button>
  </div>

  <section id="p-ov" role="tabpanel">
    <div class="split even">
      <section class="box accent" style="--c:var(--bad)" aria-labelledby="h-tr">
        <h3 id="h-tr"><span class="ico"></span>نيابة المرور</h3>
        <p>رقم اللوحة: <span class="plate" id="plate"></span></p>
        <p>إجمالي المخالفات المستحقة: <b class="big" id="due" style="font-size:1.5rem"></b> <small>جم</small></p>
        <div id="violations"></div>
        <div class="btn-row" id="payAllRow"><button class="button" id="payAll" type="button">دفع كل المخالفات</button></div>
      </section>
      <div class="stack">
        <section class="box accent" style="--c:var(--ok)" aria-labelledby="h-lic"><h3 id="h-lic"><span class="ico"></span>رخصة القيادة</h3><div id="license"></div></section>
        <section class="box accent" style="--c:var(--info)" aria-labelledby="h-civ"><h3 id="h-civ"><span class="ico"></span>الأحوال المدنية</h3><div id="civil"></div></section>
      </div>
    </div>
  </section>
  <section id="p-svc" role="tabpanel" hidden><div id="svcGrid"></div></section>
  <section id="p-reqs" role="tabpanel" hidden><div class="box"><h3> متابعة طلباتي</h3><div id="reqs"></div></div></section>
</main>
<script src="assets/js/qr.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/gov.js"></script>
<script src="assets/js/catalog.js"></script>
<script>
ID.ready(function (u, D) {
  const $ = id => document.getElementById(id), st = ID.state(), tr = D.traffic(), e = ID.esc, DD = Gov.DOCDEF;
  function doPay(amount, title, after) {
    ID.confirm('تأكيد الدفع', 'سيتم خصم ' + ID.fmt(amount) + ' جم من حسابك الجاري مقابل: ' + title + '.', 'ادفع الآن').then(ok => {
      if (!ok) return; const r = ID.pay(amount, title, { org: 'الإدارة العامة للمرور', details: [['رقم اللوحة', tr.plate]] });
      if (!r.ok) { ID.toast(r.err, true); return; } after(); ID.save(); render();
    });
  }
  function render() {
    $('plate').textContent = tr.plate;
    const open = tr.viol.filter(v => !st.paid[v.id]), sum = open.reduce((s, v) => s + v.amount, 0);
    $('due').textContent = ID.fmt(sum);
    $('violations').innerHTML = tr.viol.length ? tr.viol.map(v => { const paid = !!st.paid[v.id];
      return '<div class="vio"><div><b>' + e(v.desc) + '</b><br><small>رقم ' + v.id + ' • ' + ID.fmtDate(v.date) + '</small></div><div>' + (paid ? '<span class="pill ok">مسددة</span>' : '<b class="bad">' + v.amount + ' جم</b> <button class="button sm" data-pay="' + v.id + '" type="button">دفع</button>') + '</div></div>'; }).join('')
      : '<p class="empty" style="padding:16px"><span class="em"></span>لا توجد مخالفات مسجلة على هذه المركبة.</p>';
    $('payAllRow').hidden = open.length < 2;
    const l = Gov.licData(u);
    if (!l.has) $('license').innerHTML = '<p class="muted">رخصة القيادة تتاح بعد بلوغ سن 18 سنة.</p>';
    else { const expired = l.exp < ID.NOW;
      $('license').innerHTML = '<div class="kv"><span>رقم الرخصة</span><b class="mono">' + l.no + '</b></div><div class="kv"><span>الفئة</span><b>' + e(l.cls) + '</b></div><div class="kv"><span>تاريخ الانتهاء</span><b>' + ID.fmtDate(l.exp) + '</b></div><div class="kv"><span>الحالة</span><span class="pill ' + (expired ? 'bad' : 'ok') + '">' + (expired ? 'منتهية' : 'سارية') + '</span></div>' +
        '<div class="btn-row"><button class="button sm" data-d="license.renew">تجديد (' + DD['license.renew'].fee + ' جم)</button><button class="button outline sm" data-d="license.update">تحديث (' + DD['license.update'].fee + ' جم)</button><button class="button ghost sm" data-pr="license"> طباعة</button></div>'; }
    const x = Gov.idData(u);
    $('civil').innerHTML = u.age < 16 ? '<p class="muted">بطاقة الرقم القومي تُصدر بعد بلوغ 16 سنة.</p>' :
      '<div class="kv"><span>بطاقة الرقم القومي</span><b>صادرة ' + ID.fmtDate(x.issue) + '</b></div><div class="kv"><span>تنتهي في</span><b>' + ID.fmtDate(x.exp) + '</b></div><div class="kv"><span>الحالة</span>' + (x.pending ? '<span class="pill warn">بانتظار الاستلام</span>' : '<span class="pill ok">سارية</span>') + '</div>' +
      '<div class="btn-row"><button class="button sm" data-d="id.renew">تجديد (' + DD['id.renew'].fee + ' جم)</button><button class="button outline sm" data-d="id.update">تحديث (' + DD['id.update'].fee + ' جم)</button><button class="button ghost sm" data-pr="id"> طباعة</button><a class="button ghost sm" href="wallet.html#birth">شهادة الميلاد</a></div>';
  }
  document.addEventListener('click', ev => { const d = ev.target.closest('[data-d]'), p = ev.target.closest('[data-pr]');
    if (d) Gov.run(DD[d.dataset.d], { refresh: render }); if (p) Gov.printHtml(Gov.DOCS[p.dataset.pr]({}, u)); });
  $('violations').addEventListener('click', ev => { const b = ev.target.closest('[data-pay]'); if (!b) return; const v = tr.viol.find(x => x.id === b.dataset.pay); doPay(v.amount, 'مخالفة مرورية ' + v.id, () => { st.paid[v.id] = Date.now(); }); });
  $('payAll').onclick = () => { const open = tr.viol.filter(v => !st.paid[v.id]); doPay(open.reduce((s, v) => s + v.amount, 0), 'سداد مخالفات مرورية (' + open.length + ')', () => { open.forEach(v => { st.paid[v.id] = Date.now(); }); }); };
  Gov.grid($('svcGrid'), Gov.CAT.interior, { refresh: render });
  Gov.tabs(document, { ov: {}, svc: {}, reqs: { on: () => Gov.requestsList($('reqs')) } }, 'ov');
  render();
});
</script>
</body>
</html>
